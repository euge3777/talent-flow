<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Pick an interview time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .cand-top { display: flex; justify-content: center; padding: 18px 16px 0; }
    .cand-top .pill-nav { padding: 9px 20px; font-family: var(--serif); font-size: 14px; gap: 10px; align-items: center; }
    .cand-top .pill-nav em { font-size: 16px; font-weight: 500; }
    .cand-top .pill-nav span { color: var(--mist); font-family: var(--sans); font-size: 12px; }
    main { max-width: 880px; }
    .statement h1 { font-size: 30px; }
    .prep { color: var(--ink-soft); font-family: var(--serif); font-size: 14px; font-style: italic; margin-top: 14px; }
    .zone { display: flex; justify-content: center; margin: -36px 0 44px; }
    .days .section { grid-template-columns: 170px 1fr; margin-bottom: 0; padding: 22px 0; border-top: 1px solid var(--hairline); }
    .days .section:last-child { border-bottom: 1px solid var(--hairline); }
    .days .label { font-size: 15px; }
    .times { display: flex; flex-wrap: wrap; gap: 8px; }
    .times button { padding: 8px 16px 8px 10px; gap: 10px; font-size: 14px; font-weight: 500; }
    .times button:hover { border-color: var(--ink); background: var(--paper); }
    .times button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .hold { text-align: center; }
    .hold .left { font-variant-numeric: tabular-nums; }
    .panel { max-width: 560px; margin: 0 auto; }
    .facts { display: grid; grid-template-columns: 110px 1fr; gap: 10px 20px; margin: 0 auto 32px; max-width: 520px; font-size: 15px; }
    .facts dt { color: var(--mist); }
    .facts dd { margin: 0; }
    .actions-center { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .other { max-width: 560px; margin: 48px auto 0; }
    @media (max-width: 600px) {
      .statement h1 { font-size: 23px; }
      .days .section { grid-template-columns: 1fr; }
      .zone { margin-top: -20px; }
    }
  </style>
</head>
<body>
  <header class="cand-top"><div class="pill-nav" id="brand"><em>Acme</em><span>Interview scheduling</span></div></header>
  <main id="page"><p class="empty">Loading your times…</p></main>
  <script type="module" src="/book.js"></script>
</body>
</html>
